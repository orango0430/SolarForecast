# docker compose up --build 한 번으로 전체 실행
# 대시보드 http://localhost:8080  MLflow http://localhost:5000  Grafana http://localhost:3000
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: solarcast
      POSTGRES_USER: solarcast
      POSTGRES_PASSWORD: solarcast
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarcast"]
      interval: 5s
      retries: 20

  mlflow:
    build: ./infra/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://solarcast:solarcast@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000}"
    volumes:
      - mlartifacts:/mlartifacts
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 30

  model-api:
    build: ./ml
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 600s
      retries: 10
    # 외부에 열지 않는다: Spring만 내부망으로 호출

  spring-app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/solarcast?reWriteBatchedInserts=true
      MODEL_API_URL: http://model-api:8000
      SEED_DIR: /app/data/processed
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
    volumes:
      - ./data:/app/data:ro
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      model-api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  mlartifacts:
