global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spring-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-app:8080"]
  - job_name: model-api
    metrics_path: /metrics
    static_configs:
      - targets: ["model-api:8000"]
